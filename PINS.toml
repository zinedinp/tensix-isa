# Pinned specification inputs of the generated tables. Bumping one invalidates the
# measured layouts until their gates are re-run.

[tt-isa-documentation]
# The ISA specification. `cargo xtask fetch-spec` fetches it into
# vendor/tt-isa-documentation; `TT_ISA_DOCS` names a local checkout instead.
repo = "https://github.com/tenstorrent/tt-isa-documentation"
rev  = "f848eb668c2aeae742a88a49a86157e24a0a20c6"
# SHA-256 over the contents of the files the generator reads (Diagrams/Src/Bits32.lua,
# every page under the two TensixCoprocessor trees, the two NoC/Atomics.md,
# Miscellaneous/FMA/fma.c) as (path, length, bytes) in sorted path order.
content_sha256 = "218cc3281f0216070c2586db23cc747b3ba3ae0b23de81114cbd15820abbfc30"

